# GitHub Code Reviewer — local development compose.
#
# `docker compose -f docker/compose.yml up --build` is meant to be enough.
# The worker runs local subscription-backed Claude/Codex CLIs from the app
# image; CLI auth is stored on the ./data volume.

name: gcr

services:
  # ── 1. server: HTTP, ingest, UI ────────────────────────────────────────────
  server:
    image: gcr-app:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    env_file: ../.env
    command: ["node", "--enable-source-maps", "apps/server/dist/main.js"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/var/lib/gcr
    restart: unless-stopped
    healthcheck:
      # The app image is `node:20-bookworm-slim`, where `node` is on PATH at
      # /usr/local/bin/node. (The distroless sandbox image uses /nodejs/bin/node;
      # do not copy that path here.)
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s

  # ── 2. worker: background processor that runs reviewer CLIs ───────────────
  worker:
    image: gcr-app:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    env_file: ../.env
    command: ["node", "--enable-source-maps", "apps/worker/dist/main.js"]
    volumes:
      - ./data:/var/lib/gcr
    environment:
      HOME: "/var/lib/gcr"
      CLAUDE_CODE_HOME: "${CLAUDE_CODE_HOME:-/var/lib/gcr}"
      CODEX_HOME: "${CODEX_HOME:-/var/lib/gcr/.codex}"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s

  # ── 3. litestream: continuous SQLite WAL replication ───────────────────────
  litestream:
    image: litestream/litestream:0.3.13
    command: ["replicate", "-config", "/etc/litestream.yml"]
    volumes:
      - ./data:/data
      - ./backups:/backups
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on:
      - server
    restart: unless-stopped

  # ── 4. ngrok (optional, profile-gated): public tunnel for local dev ────────
  #
  # Opt-in: only starts when you pass `--profile ngrok`. Requires NGROK_AUTHTOKEN
  # in .env (free tier: https://dashboard.ngrok.com/get-started/your-authtoken).
  # Set NGROK_DOMAIN to your reserved free-tier domain to keep PUBLIC_URL
  # stable across restarts (otherwise the URL changes each session).
  #
  # Don't invoke this directly — use `pnpm tunnel:ngrok`, which prefers an
  # already-running host ngrok at 127.0.0.1:4040 and only falls back to this
  # service if none is found.
  #
  # The web UI / API (http://localhost:4040) is bound to localhost only.
  #
  # Why both `env_file` AND `environment`:
  #   - env_file injects everything from .env at container start (runtime).
  #   - environment then conditionally adds the --domain flag, which we have
  #     to assemble in shell because compose can't omit a flag based on a
  #     variable being empty.
  ngrok:
    image: ngrok/ngrok:3
    entrypoint: ["/bin/sh", "-c"]
    # If NGROK_DOMAIN is set, pin the tunnel to it (stable URL across restarts
    # — required for the free-tier reserved domain). Otherwise let ngrok pick
    # an ephemeral one. The `--log=stdout` makes container logs useful.
    command:
      - >-
        if [ -n "$$NGROK_DOMAIN" ]; then
          exec ngrok http --log=stdout "--domain=$$NGROK_DOMAIN" server:3000;
        else
          exec ngrok http --log=stdout server:3000;
        fi
    env_file: ../.env
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      server:
        condition: service_healthy
    profiles: ["ngrok"]
    restart: unless-stopped

networks:
  default:
    name: gcr-default
