# GitHub Code Reviewer — local + production compose.

name: gcr

services:
  server:
    image: gcr-app:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    env_file: ../.env
    command: ["node", "--enable-source-maps", "apps/server/dist/main.js"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/var/lib/gcr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s

  worker:
    image: gcr-app:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    env_file: ../.env
    command: ["node", "--enable-source-maps", "apps/worker/dist/main.js"]
    volumes:
      - ./data:/var/lib/gcr
    environment:
      HOME: "/var/lib/gcr"
      CLAUDE_CODE_HOME: "${CLAUDE_CODE_HOME:-/var/lib/gcr}"
      CODEX_HOME: "${CODEX_HOME:-/var/lib/gcr/.codex}"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s

networks:
  default:
    name: gcr-default
