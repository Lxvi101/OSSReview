# Litestream replication config.
#
# Replicates the SQLite WAL continuously to one or more destinations. The
# destination configured below is a local file replica — useful as a
# zero-cost smoke test that replication is happening. For production add an
# `s3://` (or `abs://`, `gcs://`) replica alongside it.
#
# Restoration:
#   docker compose stop server worker
#   litestream restore -if-replica-exists -o data/gcr.sqlite file:///backups/gcr
#   docker compose up -d
#
# See `docs/operations.md` for the full runbook.

dbs:
  - path: /data/gcr.sqlite
    # Continuous WAL streaming with NORMAL pragma is correct for SQLite +
    # Litestream; no other config needed.
    replicas:
      # Local replica — survives a corrupted DB file but not a host loss.
      - type: file
        path: /backups/gcr
        # Snapshot every 30 minutes; retain 24 hours of snapshots.
        snapshot-interval: 30m
        retention: 24h
        retention-check-interval: 1h
        sync-interval: 1s

      # Uncomment and configure to add an S3 replica (recommended for
      # production). Credentials come from env (AWS_*) inherited by the
      # litestream container — set them in `.env` and reference in compose.yml.
      #
      # - type: s3
      #   bucket: your-bucket-name
      #   path: gcr/
      #   region: us-east-1
      #   snapshot-interval: 1h
      #   retention: 168h     # 7 days
      #   sync-interval: 5s
